[package]
name = "flauncher_core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
tar = "0.4"
flate2 = "1.0"
xz2 = "0.1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"



